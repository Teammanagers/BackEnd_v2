version: '3.8'

services:
  app:
    image: __APP_IMAGE_TAG__
    container_name: teammangers-app
    ports:
      - "8080:8080"
    networks:
      - teammangers-net
    depends_on:
      - redis
    # env_file은 Docker가 컨테이너에 '환경 변수'를 주입하는 역할 (그대로 유지)
    env_file:
      - ./.env
    # FIX: volumes를 사용하여 EC2에 있는 .env '파일 자체'를 컨테이너 안으로 복사
    # 이렇게 하면, 컨테이너 안에서도 Spring의 `spring.config.import`가 성공적으로 파일을 찾을 수 있습니다.
    volumes:
      - ./.env:/.env

  redis:
    image: redis:latest
    container_name: teammangers-redis
    networks:
      - teammangers-net
    restart: unless-stopped

networks:
  teammangers-net:
